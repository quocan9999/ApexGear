services:
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: apexgear
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apexgear"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "cd apps/api && npx prisma generate && npx prisma db push && npm run seed:snapshot && cd ../.. && npm run dev:api"
    ports:
      - "3001:3001"
    env_file:
      - path: ./apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres-db:5432/apexgear
    depends_on:
      postgres-db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app/apps/api
          ignore:
            - node_modules/
        - action: sync
          path: ./packages/shared
          target: /app/packages/shared
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:web
    ports:
      - "3000:3000"
    env_file:
      - path: ./apps/web/.env
        required: false
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app/apps/web
          ignore:
            - node_modules/
        - action: sync
          path: ./packages/shared
          target: /app/packages/shared
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

  admin:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:admin
    ports:
      - "5174:5174"
    env_file:
      - path: ./apps/admin/.env
        required: false
    develop:
      watch:
        - action: sync
          path: ./apps/admin
          target: /app/apps/admin
          ignore:
            - node_modules/
        - action: sync
          path: ./packages/shared
          target: /app/packages/shared
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

volumes:
  postgres-data:
