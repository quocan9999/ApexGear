version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ApexGearPassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ApexGearPassword123!' -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
      - "5173:5173"
      - "5174:5174"
    depends_on:
      mssql:
        condition: service_healthy
    env_file:
      - apps/api/.env
    environment:
      # Override database URLs to point to the mssql container instead of localhost
      DATABASE_URL: "sqlserver://mssql:1433;database=apexgear;user=sa;password=ApexGearPassword123!;trustServerCertificate=true;encrypt=true"
      RAW_DATABASE_URL: "sqlserver://mssql:1433;database=gearvn_raw;user=sa;password=ApexGearPassword123!;trustServerCertificate=true;encrypt=true"
      # Ensure frontend URLs are correct for the host browser
      FRONTEND_URL: "http://localhost:5173"
      ADMIN_URL: "http://localhost:5174"
    command: >
      sh -c "
      cd apps/api &&
      echo 'Running migrations...' &&
      npx prisma migrate deploy &&
      echo 'Pushing raw database schema...' &&
      npm run db:raw:push &&
      echo 'Seeding database...' &&
      npx prisma db seed &&
      cd ../.. &&
      echo 'Starting all services...' &&
      npm run dev:api &
      npm run dev:web -- --host 0.0.0.0 &
      npm run dev:admin -- --host 0.0.0.0 &
      wait
      "
