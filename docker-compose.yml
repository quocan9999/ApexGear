services:
  mssql:
    build:
      context: .
      dockerfile: Dockerfile
      target: mssql
    image: apexgear-mssql:local
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ApexGearPassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ApexGearPassword123!' -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  db-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: bootstrap
    environment:
      DATABASE_URL: "sqlserver://mssql:1433;database=apexgear;user=sa;password=ApexGearPassword123!;encrypt=true;trustServerCertificate=true"
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"

volumes:
  mssql-data:
